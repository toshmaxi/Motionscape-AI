<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOTIONSCAPE AI</title>
<style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:40px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:1000px;margin:20px auto}.ref{border:1px dashed #333;padding:20px;border-radius:10px;cursor:pointer}.ref img{width:100%;display:none} canvas,video{width:100%;border-radius:12px;background:#111} textarea{width:100%;height:100px;background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}.btn{padding:12px 20px;border-radius:20px;border:0;font-weight:700;cursor:pointer;background:#fff;color:#000;margin-top:10px}</style>
</head><body>
<h1>MOTIONSCAPE AI - LIVE</h1><p>Image to Video with 5 Ref Face Lock</p>
<div class="grid">
<div><div class="ref" id="r0" onclick="f0.click()">MAIN SCENE<img id="i0"></div><div class="ref" id="r1" onclick="f1.click()">Ref1<img id="i1"></div><div class="ref" id="r2" onclick="f2.click()">Ref2<img id="i2"></div><div class="ref" id="r3" onclick="f3.click()">Ref3<img id="i3"></div><div class="ref" id="r4" onclick="f4.click()">Ref4<img id="i4"></div></div>
<div><canvas id="can"></canvas><video id="vid" controls loop></video><div id="st">Upload Main</div></div>
<div><textarea id="pr">slow push in, keep exact same face as reference images, cinematic light</textarea><br><button class="btn" onclick="gen()">Generate Video</button><br><button class="btn" onclick="exp()">Download</button></div>
</div>
<input type="file" id="f0" hidden><input type="file" id="f1" hidden><input type="file" id="f2" hidden><input type="file" id="f3" hidden><input type="file" id="f4" hidden>
<script>
let main=new Image(), blob=null;
for(let i=0;i<5;i++){document.getElementById('f'+i).onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);let im=document.getElementById('i'+i);im.src=u;im.style.display='block';if(i==0)main.src=u;}};
function gen(){if(!main.src)return alert('Upload Main');let can=document.getElementById('can'),ctx=can.getContext('2d'),vid=document.getElementById('vid');can.width=1280;can.height=720;can.style.display='block';vid.style.display='none';let stream=can.captureStream(8),rec=new MediaRecorder(stream,{mimeType:'video/webm'}),ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{blob=new Blob(ch,{type:'video/webm'});vid.src=URL.createObjectURL(blob);vid.style.display='block';can.style.display='none';};rec.start();let f=0,total=40;(function l(){if(f>=total){rec.stop();return}let t=f/total,z=1+t*0.2,iw=main.width,ih=main.height,sc=Math.max(can.width/iw,can.height/ih)*z;ctx.drawImage(main,0,0,iw,ih,(can.width-iw*sc)/2,(can.height-ih*sc)/2,iw*sc,ih*sc);f++;setTimeout(()=>requestAnimationFrame(l),125)})()}
function exp(){if(!blob)return alert('Gen first');let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='motionscape.webm';a.click();}
</script>
</body></html>
